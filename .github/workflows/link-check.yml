name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check links
        run: python scripts/check_links.py --report link-report.json
      - name: Save link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.json
